name: Test and Coverage

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run unit tests with coverage
        run: |
          # Retry up to 3 times with 30s delay to handle transient Maven Central failures
          for i in 1 2 3; do
            ./mvnw -B -DskipITs=true test jacoco:report && break || {
              if [ $i -lt 3 ]; then
                echo "Build attempt $i failed. Retrying in 30 seconds..."
                sleep 30
              else
                echo "Build failed after 3 attempts"
                exit 1
              fi
            }
          done

      - name: Publish coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: target/site/jacoco/jacoco.xml
          badge: true
          format: markdown
          output: both

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html
          path: target/site/jacoco/

      - name: Upload JaCoCo XML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
