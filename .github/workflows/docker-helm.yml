name: Build and Publish Docker image + Helm chart

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build backend + web (skip tests)
        run: ./mvnw -B -DskipTests package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/redis-manager
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V=${{ github.ref_name }}
            echo "tags=$IMAGE:latest,$IMAGE:$V,$IMAGE:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMAGE:latest,$IMAGE:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image (JVM)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Upload image digest
        run: echo ${{ steps.buildx.outputs.digest }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        run: |
          helm lint charts/redis-manager || true
          helm dependency update charts/redis-manager || true
          helm package charts/redis-manager --destination ./chart-packages

      - name: Push Helm chart to GHCR (OCI)
        env:
          CR_OWNER: ${{ github.repository_owner }}
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          for f in ./chart-packages/*.tgz; do
            helm push "$f" oci://ghcr.io/${CR_OWNER}/charts || true
          done

      - name: Upload chart package artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: chart-packages/*.tgz
