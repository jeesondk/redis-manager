# ============================================================================
# JVM Arguments Configuration
# ============================================================================
# These JVM arguments are required for Java 17+ compatibility:
# 1. --add-opens java.base/java.lang=ALL-UNNAMED
#    - Required for JBoss Threads to access internal Java APIs
#    - Prevents: IllegalAccessError on thread-local reset capability
# 2. -Dio.netty.noUnsafe=true
#    - Disables Netty's use of deprecated sun.misc.Unsafe
#    - Prevents: WARNING about sun.misc.Unsafe deprecation
#
# NOTE: These settings work for 'mvnw quarkus:dev'. For 'java -jar', you must
# pass these as command-line arguments since the JVM is already running.
# See JVM-ARGUMENTS.md for details on different runtime scenarios.
# ============================================================================

# JVM args for Quarkus run/prod (when using Quarkus runner)
quarkus.jvm.args=--add-opens java.base/java.lang=ALL-UNNAMED -Dio.netty.noUnsafe=true

# JVM args for Quarkus dev mode (quarkus:dev)
# Dev mode does not inherit quarkus.jvm.args, so set flags here as well
quarkus.dev.jvm-args=--add-opens java.base/java.lang=ALL-UNNAMED -Dio.netty.noUnsafe=true

# Set Netty system property to disable Unsafe usage (backup for when JVM args don't apply)
# This is also set programmatically in NettyConfigurer to ensure it's applied early
%prod.quarkus.native.system-properties."io.netty.noUnsafe"=true

# ============================================================================
# Frontend Configuration (Quinoa + Vite + Tailwind)
# ============================================================================

quarkus.quinoa.ui-dir=src/main/webui
quarkus.quinoa.build-dir=dist/client

# Let Quinoa download and use its own Node/NPM
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.10.0
quarkus.quinoa.package-manager-install.npm-version=11.6.0

# Choose the package manager (fallback is auto-detected via lockfile)
quarkus.quinoa.package-manager=npm

# Dev server proxy port
quarkus.quinoa.dev-server.port=5173

# ============================================================================
# Application & Observability Configuration
# ============================================================================

# Identify your service
quarkus.application.name=react-ssr
quarkus.otel.resource.attributes=service.version=1.0.0,deployment.environment=dev

# Where to send telemetry (defaults to http://localhost:4317 if omitted)
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
#quarkus.otel.metrics.enabled=true
#quarkus.otel.traces.exporter=otlp

# Add trace ids to logs (handy for debugging)
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId} [%c{2.}] (%t) %s%e%n

# ============================================================================
# Metrics & Management Configuration
# ============================================================================

# Keep metrics on a separate port
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.root-path=/management

# Include common binders
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server=true
quarkus.micrometer.binder.system=true

# ============================================================================
# OpenAPI & Swagger UI Configuration
# ============================================================================

# Always include Swagger UI (also in prod) and expose it on management interface
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.management.enabled=true
quarkus.swagger-ui.urls.default=/management/openapi

# Expose OpenAPI document on management interface as well
quarkus.smallrye-openapi.management.enabled=true

# ============================================================================
# Security Configuration (OIDC)
# ============================================================================

# Disable OIDC and its DevServices during tests to avoid starting Keycloak Docker
quarkus.oidc.enabled=false
quarkus.oidc.devservices.enabled=false

# ============================================================================
# Development Mode Configuration
# ============================================================================

# Quinoa dev WebSocket noise suppression (only in dev):
# Silence benign Vert.x errors from Vite/Quinoa HMR websocket closing during proxying
%dev.quarkus.log.category."io.quarkus.vertx.core.runtime".level=OFF

# Reduce Quinoa dev logs to WARN to keep console clean
%dev.quarkus.log.category."io.quarkiverse.quinoa".level=WARN
